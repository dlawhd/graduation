<!--
  Memory Jar 브라우저/앱 아이콘 최종 버전

  변경 내용:
  - 기존 분홍색 포인트 완전 제거
  - 가운데 비어 보이던 부분을 정리해서 더 단정한 흰색 M 형태로 통일
  - 민트 둥근 사각형 배경 유지
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="bg" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
            <stop stop-color="#9DE8DD"/>
            <stop offset="1" stop-color="#79D8CC"/>
        </linearGradient>

        <linearGradient id="shine" x1="16" y1="12" x2="48" y2="50" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FFFFFF" stop-opacity="0.18"/>
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
        </linearGradient>

        <filter id="shadow" x="10" y="14" width="44" height="38" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
            <feOffset dy="1.2"/>
            <feGaussianBlur stdDeviation="1.2"/>
            <feColorMatrix type="matrix" values="0 0 0 0 0.17 0 0 0 0 0.47 0 0 0 0 0.44 0 0 0 0.14 0"/>
            <feBlend in2="SourceGraphic" result="shape"/>
        </filter>
    </defs>

    <!-- 민트 둥근 사각형 배경 -->
    <rect x="6" y="6" width="52" height="52" rx="15" fill="url(#bg)"/>

    <!-- 안쪽 은은한 하이라이트 -->
    <rect x="9" y="9" width="46" height="46" rx="13" fill="url(#shine)"/>

    <!--
      흰색 M 모노그램
      - 분홍색 요소 없음
      - 가운데가 어색하게 비어 보이지 않도록
        단정한 채움형 M 형태로 구성
    -->
    <g
            filter="url(#shadow)"
            transform="translate(32 32) scale(1.12) translate(-32 -32)"
    >
        <path
                fill="white"
                d="M20 46
       C17.79 46 16 44.21 16 42V22
       C16 19.79 17.79 18 20 18
       C21.28 18 22.48 18.61 23.23 19.64
       L32 31.49
       L40.77 19.64
       C41.52 18.61 42.72 18 44 18
       C46.21 18 48 19.79 48 22V42
       C48 44.21 46.21 46 44 46
       C41.79 46 40 44.21 40 42V33.9
       L35.21 40.37
       C34.45 41.4 33.26 42 32 42
       C30.74 42 29.55 41.4 28.79 40.37
       L24 33.9V42
       C24 44.21 22.21 46 20 46Z"
        />
    </g>
</svg>