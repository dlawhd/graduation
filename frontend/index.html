<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <!--
    모바일 화면에서도 페이지가 기기 너비에 맞게 보이도록 설정한다.
  -->
  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0"
  />

  <!--
    Memory Jar 브라우저 탭 전용 아이콘.

    최신 브라우저에서는 SVG favicon을 사용한다.
    아이콘 파일을 새로 교체했기 때문에
    캐시 갱신을 위해 버전 번호도 올려준다.
  -->
  <link
          rel="icon"
          href="/memory-jar-favicon.svg?v=102"
          type="image/svg+xml"
  />

  <!--
    iPhone / iPad에서
    "홈 화면에 추가"했을 때 사용할 전용 아이콘.

    이번에 따로 만든 apple-touch-icon.png를 사용한다.
  -->
  <link
          rel="apple-touch-icon"
          href="/apple-touch-icon.png?v=1"
  />

  <!--
    Android / PWA 설치 정보를 담고 있는 manifest 파일.

    manifest.json 안에서
    logo192.png와 logo512.png를 설치 아이콘으로 사용한다.
  -->
  <link
          rel="manifest"
          href="/manifest.json"
  />

  <!--
    브라우저 주소창이나 모바일 UI에서 사용할
    Memory Jar 대표 색상.
  -->
  <meta
          name="theme-color"
          content="#ECFDF5"
  />

  <!-- 브라우저 탭에 표시되는 서비스 이름 -->
  <title>Memory Jar</title>
</head>

<body>
<!-- React 애플리케이션이 들어가는 자리 -->
<div id="root"></div>

<!-- Vite가 React 애플리케이션을 시작하는 파일 -->
<script
        type="module"
        src="/src/main.jsx"
></script>
</body>
</html>
