<svg xmlns="http://www.w3.org/2000/svg" width="220" height="48" viewBox="0 0 220 48" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Memory Jar 서비스 이용하기</title>
  <desc id="desc">파스텔 원 안의 유리 저금통 아이콘과 서비스 이용하기 문구. 테두리 박스와 화살표 없이 아이콘과 글자의 중심 높이를 맞춘 README 링크 이미지입니다.</desc>
  <!-- 사이트 헤더의 MemoryJarLogoIcon.jsx 도형을 재사용한다. 아이콘과 문구를 같은 좌표계에 배치해 GitHub에서도 높이가 어긋나지 않도록 한다. -->
  <defs>
    <linearGradient id="halo" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D1FAE5" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#ECFEFF"/>
      <stop offset="1" stop-color="#EDE9FE" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="edge" x1="9" y1="11" x2="39" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC"/>
      <stop offset="0.25" stop-color="#C4B5FD"/>
      <stop offset="0.48" stop-color="#FBCFE8"/>
      <stop offset="0.68" stop-color="#FEF08A"/>
      <stop offset="0.84" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
