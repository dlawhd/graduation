# Only support screenshot requests receive a larger proxy envelope.
# The application still enforces 2 MiB per image, consent, ownership, CSRF and concurrency limits.
location ~ ^/api/v1/(?:public/support|admin/support|support)/inquiries/[1-9][0-9]*/attachments$ {
    client_max_body_size 3m;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
