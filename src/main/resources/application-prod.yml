spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://db:3306/appdb?useUnicode=true&characterEncoding=utf8}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.mariadb.jdbc.Driver}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  security:
    oauth2:
      client:
        registration:
          # --------------------------------------------------
          # 네이버 OAuth 배포 환경 인증 정보
          #
          # 실제 Client ID / Secret은 GitHub 코드에 저장하지 않고
          # 서버의 환경변수에서 가져온다.
          # --------------------------------------------------
          naver:
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_NAVER_CLIENT_ID}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_NAVER_CLIENT_SECRET}
            client-authentication-method: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_NAVER_CLIENT_AUTHENTICATION_METHOD:client_secret_post}

          # --------------------------------------------------
          # Google OAuth 배포 환경 인증 정보
          #
          # Google Cloud에서 발급받은 실제 Client ID / Secret은
          # 서버 환경변수에만 저장한다.
          # --------------------------------------------------
          google:
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}

          # --------------------------------------------------
          # Kakao OAuth 배포 환경 인증 정보
          #
          # Kakao Developers에서 발급받은
          # REST API Key와 Client Secret은
          # GitHub 코드에 직접 저장하지 않는다.
          #
          # 실제 값은 운영 서버의 환경변수에서 주입한다.
          # --------------------------------------------------
          kakao:
            # Kakao의 client-id는 "REST API Key"를 사용한다.
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_ID}

            # Kakao Developers에서 발급받은 Client Secret을 사용한다.
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_SECRET}

app:
  # --------------------------------------------------
  # 이메일 인증번호 HMAC 전용 Secret
  #
  # 운영환경에서는 코드나 GitHub에 적지 않고
  # EC2 환경변수로 전달한다.
  # --------------------------------------------------
  auth:
    email-verification-secret: ${APP_EMAIL_VERIFICATION_SECRET}

  # --------------------------------------------------
  # AWS SES 운영 설정
  # --------------------------------------------------
  ses:
    # SES는 Region별로 Sandbox/Verified Identity가 따로 관리되므로
    # 실제 SES를 설정한 Region과 반드시 같아야 한다.
    region: ${APP_SES_REGION:ap-northeast-2}

    # Amazon SES에서 인증 완료한 발신 이메일
    #
    # 예:
    # no-reply@esjh.shop
    #
    # GitHub에 실제 이메일 값을 박아두기보다는
    # 환경변수로 관리한다.
    from-email: ${APP_SES_FROM_EMAIL}

  jwt:
    secret: ${APP_JWT_SECRET}
    access-exp-seconds: ${APP_JWT_ACCESS_EXP_SECONDS:1800}
    refresh-exp-seconds: ${APP_JWT_REFRESH_EXP_SECONDS:1209600}

  frontend-url: ${APP_FRONTEND_URL:https://www.esjh.shop}

  cors:
    # OAuth 로그인 성공 후 이동할 주소와
    # REST/WebSocket 요청을 허용할 주소를 같은 값으로 사용한다.
    allowed-origin-patterns:
      - ${APP_FRONTEND_URL:https://www.esjh.shop}

  cookie:
    secure: true
    same-site: None
    domain: ${APP_COOKIE_DOMAIN:}