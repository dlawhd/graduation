spring:
  application:
    name: demo

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      client:
        registration:
          naver:
            client-name: Naver
            # --------------------------------------------------
            # 네이버 OAuth 로그인 설정
            # --------------------------------------------------
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
          # --------------------------------------------------
          # Google OAuth 로그인 설정
          # Google 로그인에 필요한 기본 사용자 정보만 요청한다.
          # Client ID / Secret은 코드에 직접 적지 않고 실행 환경별 설정에서 따로 주입한다.
          # --------------------------------------------------
          google:
            client-name: Google
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              # Google 사용자를 고유하게 식별한다.
              - openid
              # 이름, 프로필 사진 같은 기본 프로필 정보를 요청한다.
              - profile
              # Google 이메일 주소를 요청한다.
              - email
          # --------------------------------------------------
          # Kakao OAuth 로그인 설정
          #
          # 카카오 로그인으로 사용자 인증을 시작하기 위한 공통 설정이다.
          #
          # 실제 REST API Key(Client ID)와 Client Secret은
          # GitHub 코드에 직접 저장하지 않고
          # application-prod.yml / 실행 환경변수에서 따로 주입한다.
          # --------------------------------------------------
          kakao:
            client-name: Kakao

            # 카카오 REST API 키의 Client Secret을
            # 토큰 요청 Body에 넣어서 전달하는 방식이다.
            client-authentication-method: client_secret_post

            # OAuth2의 "인가 코드 방식"을 사용한다.
            authorization-grant-type: authorization_code

            # 카카오 로그인 성공 후 카카오가 돌아올 Spring Boot 주소다.
            #
            # 로컬:
            # http://localhost:8080/login/oauth2/code/kakao
            #
            # 배포:
            # https://api.esjh.shop/login/oauth2/code/kakao
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

            # Memory Jar에서 카카오에게 요청할 최소 사용자 정보다.
            scope:
              # 저금통 멤버 이름, 채팅 작성자 등에 사용할 닉네임
              - profile_nickname

              # 기존 NAVER / GOOGLE 회원과 같은 사용자로 연결하기 위한 이메일
              - account_email

        # --------------------------------------------------
        # 네이버는 Spring 기본 OAuth Provider가 아니기 때문에 인증 주소와 사용자 정보 주소를 직접 알려준다.
        # --------------------------------------------------
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          # --------------------------------------------------
          # Kakao OAuth Provider 주소
          #
          # Spring Security에게
          # "카카오 로그인은 어느 주소로 요청하고,
          #  토큰은 어디서 받고,
          #  사용자 정보는 어디서 가져오는지"
          # 알려주는 설정이다.
          # --------------------------------------------------
          kakao:
            # 사용자를 카카오 로그인 화면으로 보내는 주소
            authorization-uri: https://kauth.kakao.com/oauth/authorize

            # 로그인 성공 후 인가 코드를 Access Token으로 교환하는 주소
            token-uri: https://kauth.kakao.com/oauth/token

            # Access Token을 이용해서 사용자 정보를 가져오는 주소
            user-info-uri: https://kapi.kakao.com/v2/user/me

            # 카카오 사용자 정보의 최상위 "id" 값을
            # OAuth 사용자의 고유 식별자로 사용한다.
            user-name-attribute: id
      # data:
      # redis:
      # host: localhost
      # port: 6379

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}

  # --------------------------------------------------
  # Memory Jar 자체 로그인 / 이메일 인증 설정
  # --------------------------------------------------
  auth:
    # 로컬 개발용 기본값이야.
    #
    # 실제 운영환경에서는 반드시
    # APP_EMAIL_VERIFICATION_SECRET 환경변수로 덮어쓴다.
    email-verification-secret: ${APP_EMAIL_VERIFICATION_SECRET:local-dev-email-verification-secret-change-me}

  # --------------------------------------------------
  # Amazon SES 이메일 발송 설정
  # --------------------------------------------------
  ses:
    # Amazon SES를 사용할 AWS Region
    #
    # Memory Jar의 AWS 인프라가 서울 Region을 사용하므로
    # 기본값도 ap-northeast-2로 둔다.
    region: ${APP_SES_REGION:ap-northeast-2}

    # SES에서 인증된 발신 이메일 주소
    #
    # 로컬 개발에서도 실제 메일을 보낼 경우
    # 환경변수 APP_SES_FROM_EMAIL을 설정한다.
    from-email: ${APP_SES_FROM_EMAIL:}

  cors:
    # frontend-url과 같은 환경변수를 사용한다.
    # 프론트 주소를 변경하면 REST와 WebSocket 허용 주소도 함께 변경된다.
    allowed-origin-patterns:
      - ${APP_FRONTEND_URL:http://localhost:3000}

  jwt:
    access-exp-seconds: 1800      # 30분
    refresh-exp-seconds: 1209600  # 14일

  cookie:
    domain: ""

  s3:
    region: ${APP_S3_REGION:}
    bucket: ${APP_S3_BUCKET:}
    public-base-url: ${APP_S3_PUBLIC_BASE_URL:}
    presign-exp-seconds: ${APP_S3_PRESIGN_EXP_SECONDS:300}

  file:
    # 사진 및 일반 이미지 파일의 최대 크기
    # 10 * 1024 * 1024 = 10MB
    max-size: ${APP_FILE_MAX_SIZE:10485760} # 10MB

    # 영상 파일만 따로 사용하는 최대 크기
    # 30 * 1024 * 1024 = 30MB
    max-video-size: ${APP_FILE_MAX_VIDEO_SIZE:31457280} # 30MB

    # 업로드 가능한 사진 형식
    allowed-image-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif

    # 업로드 가능한 영상 형식
    allowed-video-types:
      - video/mp4
      - video/quicktime
      - video/webm