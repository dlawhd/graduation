spring:
  application:
    name: demo

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      client:
        registration:
          naver:
            client-name: Naver
            # --------------------------------------------------
            # 네이버 OAuth 로그인 설정
            # --------------------------------------------------
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
          # --------------------------------------------------
          # Google OAuth 로그인 설정
          # Google 로그인에 필요한 기본 사용자 정보만 요청한다.
          # Client ID / Secret은 코드에 직접 적지 않고 실행 환경별 설정에서 따로 주입한다.
          # --------------------------------------------------
          google:
            client-name: Google
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              # Google 사용자를 고유하게 식별한다.
              - openid
              # 이름, 프로필 사진 같은 기본 프로필 정보를 요청한다.
              - profile
              # Google 이메일 주소를 요청한다.
              - email
        # --------------------------------------------------
        # 네이버는 Spring 기본 OAuth Provider가 아니기 때문에 인증 주소와 사용자 정보 주소를 직접 알려준다.
        # --------------------------------------------------
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
      # data:
      # redis:
      # host: localhost
      # port: 6379

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}

  cors:
    # frontend-url과 같은 환경변수를 사용한다.
    # 프론트 주소를 변경하면 REST와 WebSocket 허용 주소도 함께 변경된다.
    allowed-origin-patterns:
      - ${APP_FRONTEND_URL:http://localhost:3000}

  jwt:
    access-exp-seconds: 1800      # 30분
    refresh-exp-seconds: 1209600  # 14일

  cookie:
    domain: ""

  s3:
    region: ${APP_S3_REGION:}
    bucket: ${APP_S3_BUCKET:}
    public-base-url: ${APP_S3_PUBLIC_BASE_URL:}
    presign-exp-seconds: ${APP_S3_PRESIGN_EXP_SECONDS:300}

  file:
    # 사진 및 일반 이미지 파일의 최대 크기
    # 10 * 1024 * 1024 = 10MB
    max-size: ${APP_FILE_MAX_SIZE:10485760} # 10MB

    # 영상 파일만 따로 사용하는 최대 크기
    # 30 * 1024 * 1024 = 30MB
    max-video-size: ${APP_FILE_MAX_VIDEO_SIZE:31457280} # 30MB

    # 업로드 가능한 사진 형식
    allowed-image-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif

    # 업로드 가능한 영상 형식
    allowed-video-types:
      - video/mp4
      - video/quicktime
      - video/webm