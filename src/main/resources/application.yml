spring:
  application:
    name: demo

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      client:
        registration:
          naver:
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
              - birthyear
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
  # data:
    # redis:
      # host: localhost
      # port: 6379

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

  jwt:
    access-exp-seconds: 1800      # 30분
    refresh-exp-seconds: 1209600  # 14일

  cookie:
    domain: ""

  s3:
    region: ${APP_S3_REGION:}
    bucket: ${APP_S3_BUCKET:}
    public-base-url: ${APP_S3_PUBLIC_BASE_URL:}
    presign-exp-seconds: ${APP_S3_PRESIGN_EXP_SECONDS:300}

  file:
    max-size: ${APP_FILE_MAX_SIZE:10485760} # 10MB
    allowed-image-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
    allowed-video-types:
      - video/mp4
      - video/quicktime
      - video/webm