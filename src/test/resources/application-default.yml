# --------------------------------------------------
# application-default.yml 역할
#
# @ActiveProfiles("test")가 없는 테스트들이
# Spring의 default 프로필로 실행될 때 사용하는
# 테스트 전용 설정 파일이다.
#
# 실제 Google / Naver / AWS 비밀정보는 넣지 않고
# Spring Context를 생성할 수 있는 가짜 테스트 값만 사용한다.
# --------------------------------------------------

spring:
  security:
    oauth2:
      client:
        registration:

          # --------------------------------------------------
          # Naver OAuth 테스트용 가짜 인증 정보
          #
          # 실제 Naver 서버에 로그인 요청을 보내는 것이 아니라
          # Spring이 ClientRegistration을 만들 수 있게 하는 값이다.
          # --------------------------------------------------
          naver:
            client-id: test-naver-client-id
            client-secret: test-naver-client-secret

          # --------------------------------------------------
          # Google OAuth 테스트용 가짜 인증 정보
          # --------------------------------------------------
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret


app:
  # --------------------------------------------------
  # S3 테스트 설정
  #
  # S3Presigner Bean을 생성할 때 필요한 최소 설정이다.
  # 테스트에서는 실제 AWS에 접근하지 않는다.
  # --------------------------------------------------
  s3:
    region: ap-northeast-2
    bucket: test-memory-jar-bucket
    public-base-url: https://example.com/test-memory-jar
    presign-exp-seconds: 300