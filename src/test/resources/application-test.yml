spring:
  security:
    oauth2:
      client:
        registration:
          # --------------------------------------------------
          # 네이버 OAuth 테스트 설정
          #
          # 테스트에서는 실제 네이버 인증 서버에 로그인하지 않으므로
          # 실제 Client ID / Secret 대신 가짜 값을 사용한다.
          # --------------------------------------------------
          naver:
            client-id: test-naver-client-id
            client-secret: test-naver-client-secret
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
              - birthyear

          # --------------------------------------------------
          # Google OAuth 테스트 설정
          #
          # 테스트용 Spring Context가 Google Client 설정을
          # 정상적으로 만들 수 있도록 가짜 값을 사용한다.
          # 실제 Google Client Secret을 테스트 코드에 넣으면 안 된다.
          # --------------------------------------------------
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            client-name: Google
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email

          # --------------------------------------------------
          # Kakao OAuth 테스트용 가짜 인증 정보
          #
          # 실제 Kakao REST API Key / Client Secret은 사용하지 않는다.
          #
          # 나머지 Kakao OAuth 설정
          # (scope, redirect-uri, client-authentication-method 등)은
          # application.yml의 공통 설정을 그대로 재사용한다.
          # --------------------------------------------------
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret

        # --------------------------------------------------
        # Naver / Kakao는 Spring 기본 OAuth Provider가 아니다.
        #
        # Naver Provider 정보는 이 테스트 설정에 직접 작성되어 있고,
        # Kakao Provider 정보는 application.yml의 공통 설정을 재사용한다.
        #
        # Google은 Spring Security가 기본 Provider 정보를 알고 있어서
        # 별도의 Provider 주소 설정이 필요 없다.
        # --------------------------------------------------
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

app:
  # 테스트용 프론트 주소
  frontend-url: http://localhost:3000

  # 이메일 인증 테스트 전용 Secret
  #
  # 실제 운영 Secret을 테스트에 절대로 사용하지 않는다.
  auth:
    email-verification-secret: test-email-verification-secret-test-key-123456789

  # --------------------------------------------------
  # SES 테스트 전용 설정
  #
  # 단위/통합 테스트에서는 실제 이메일을 보내지 않는다.
  # Spring Context가 정상적으로 만들어지기 위한 가짜 값이다.
  # --------------------------------------------------
  ses:
    region: ap-northeast-2
    from-email: no-reply@test-memory-jar.example

  cors:
    # 테스트 요청에서 허용할 프론트 주소
    allowed-origin-patterns:
      - http://localhost:3000

  jwt:
    # 테스트 전용 JWT Secret
    # 실제 운영 Secret을 사용하지 않는다.
    secret: test-test-test-test-test-test-test-test-test-test-test-test-test

  # --------------------------------------------------
  # S3 테스트 설정
  #
  # 테스트에서 Spring Context가 S3Presigner를 만들 수 있도록
  # 실제 AWS 정보가 아닌 안전한 가짜 설정을 사용한다.
  # --------------------------------------------------
  s3:
    # AWS SDK가 Region 객체를 생성할 수 있도록 필요한 값
    region: ap-northeast-2

    # 테스트 전용 가짜 Bucket
    bucket: test-memory-jar-bucket

    # 테스트 전용 가짜 공개 URL
    public-base-url: https://example.com/test-memory-jar

    # Presigned URL 만료 시간
    presign-exp-seconds: 300