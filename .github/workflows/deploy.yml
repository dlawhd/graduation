name: deploy

on:
  workflow_run:
    workflows: ["Publish Docker image to GHCR"]
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: self-hosted
    steps:
      # 검증된 실행의 코드와 같은 실행의 artifact만 사용한다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: deployment-manifest-${{ github.event.workflow_run.head_sha }}
          path: deployment-manifest
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy verified API with health checks and rollback
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 tools/deploy/deploy-api.py --manifest deployment-manifest/deployment-manifest.json

concurrency:
  group: deploy
  # 교체/원복 도중의 강제 취소를 막는다. 오래된 실행은 배포 직전 main SHA 검사로 거절한다.
  cancel-in-progress: false
