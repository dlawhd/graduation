name: Publish Docker image to GHCR

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # GitHub 저장소 코드를 가져온다.
      - name: Checkout
        uses: actions/checkout@v4

      # 백엔드 테스트를 실행하기 위해 Java 17을 준비한다.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17

      # Gradle 의존성 캐시를 사용해서 테스트 속도를 조금 빠르게 만든다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Linux 환경에서 gradlew 실행 권한이 없을 수 있어서 권한을 부여한다.
      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      # Docker 이미지를 만들기 전에 백엔드 테스트를 먼저 실행한다.
      # 여기서 실패하면 아래 Docker build/push 단계는 실행되지 않는다.
      - name: Run backend tests
        run: ./gradlew test
        env:
          APP_JWT_SECRET: local-test-secret-key-local-test-secret-key-123456
          APP_S3_REGION: ap-northeast-2
          APP_S3_BUCKET: local-memoryjar-bucket
          APP_S3_PUBLIC_BASE_URL: http://localhost:8080/local-s3
          APP_S3_PRESIGN_EXP_SECONDS: 300

      # Docker 이미지를 빌드할 수 있도록 Buildx를 준비한다.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GitHub Container Registry에 로그인한다.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 테스트가 통과한 경우에만 Docker 이미지를 빌드하고 GHCR에 push한다.
      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest